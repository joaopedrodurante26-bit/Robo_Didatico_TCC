<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console do Robô</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Robô Vespa</h1>
      <p>Console web em tempo real</p>
    </header>

    <section class="status-panel">
      <div class="card">
        <h2>Modo</h2>
        <div id="modo">IDLE</div>
      </div>
      <div class="card">
        <h2>Wi-Fi</h2>
        <div id="wifi">ROBO_VESPA</div>
      </div>
      <div class="card">
        <h2>Distância</h2>
        <div id="distancia">-- cm</div>
      </div>
      <div class="card">
        <h2>Estado</h2>
        <div id="estado">Aguardando</div>
      </div>
    </section>

    <section class="console-panel">
      <div class="console-header">
        <strong>Console</strong>
        <button id="btnEnviar">Enviar</button>
      </div>
      <div id="output" class="output"></div>
      <div class="input-row">
        <input id="cmd" type="text" placeholder="Digite um comando (ex: status, mode, motor f)" />
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
